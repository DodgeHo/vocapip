[package]
name = "vocapip"
version = "0.3.0"
description = "An offline Windows vocabulary learning desktop pet"
authors = ["VocaPip contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77.2"

[lib]
name = "vocapip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.143"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
tempfile = "=3.27.0"
thiserror = "=2.0.16"
uuid = { version = "=1.24.1", features = ["v4"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Media_Speech",
  "Win32_System_Com",
] }

[dev-dependencies]
pretty_assertions = "=1.4.1"
tempfile = "=3.27.0"
